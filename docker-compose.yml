services:
  subastaya.api:
    image: ${DOCKER_REGISTRY-}subastayaapi
    build:
      context: .
      dockerfile: src/SubastaYa.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db-posgres;Database=subastayadb;Username=postgres;Password=tu_password
    depends_on:
        db-posgres:
         condition: service_healthy
  db-posgres:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: subastayadb
    ports:
      - "5432:5432"
    volumes:
      - db-postgres-data:/var/lib/postgresql/data

volumes:
  db-postgres-data:
